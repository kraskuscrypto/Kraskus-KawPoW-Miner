name: build

env:
  # The vendored cable modules and the fetched dependencies declare pre-3.5 CMake minimums;
  # CMake >= 3.31 honours this as an environment variable so every nested configure inherits it.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    name: linux-x64 (CUDA ${{ matrix.cuda }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.4.1", "12.8.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc", "cudart", "nvrtc", "nvrtc-dev"]'
      - name: boost and openssl
        run: sudo apt-get update && sudo apt-get install -y libboost-system-dev libboost-filesystem-dev libboost-thread-dev libboost-dev libssl-dev ninja-build
      - name: configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DETHASHCUDA=ON -DETHASHCL=OFF -DAPICORE=ON \
                -DCMAKE_CUDA_COMPILER="${{ steps.cuda.outputs.CUDA_PATH }}/bin/nvcc"
      - name: build
        run: cmake --build build --config Release --parallel
      - name: smoke
        # CI runners have no NVIDIA driver, so the binary (which links the CUDA driver API) cannot
        # start there; check its dynamic dependencies instead and run --version only when a
        # driver is present.
        run: |
          ldd build/kawpowminer/kawpowminer | tee ldd.txt
          if grep "not found" ldd.txt | grep -vqE "libcuda\.so|libnvidia"; then echo "unexpected missing library"; exit 1; fi
          if ldconfig -p | grep -q libcuda.so.1; then ./build/kawpowminer/kawpowminer --version; else echo "no NVIDIA driver on this runner; --version skipped"; fi
      - name: package
        run: |
          V=$(grep -m1 'set(PROJECT_VERSION' CMakeLists.txt | sed 's/[^0-9.]//g')
          D=kraskus-kawpowminer-$V; mkdir -p dist/$D && cp build/kawpowminer/kawpowminer dist/$D/
          (cd dist && tar czf kraskus-kawpowminer-$V-linux-x64-cuda${{ matrix.cuda }}.tar.gz $D && sha256sum *.tar.gz > SHA256SUMS-linux-cuda${{ matrix.cuda }})
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-cuda${{ matrix.cuda }}
          path: dist/*

  windows:
    name: windows-x64 (CUDA 12.8)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda
        with:
          cuda: "12.8.0"
          method: network
          sub-packages: '["nvcc", "cudart", "nvrtc", "nvrtc_dev", "visual_studio_integration"]'
      - name: vcpkg at the pinned baseline (Boost 1.86, see vcpkg.json)
        shell: pwsh
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git $env:RUNNER_TEMP/vcpkg
          git -C $env:RUNNER_TEMP/vcpkg checkout --quiet b2cb0da531c2f1f740045bfe7c4dac59f0b2b69c
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: configure (vcpkg manifest mode installs the dependencies)
        shell: cmd
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DETHASHCUDA=ON -DETHASHCL=OFF -DAPICORE=ON -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: build
        shell: cmd
        run: cmake --build build --config Release --parallel
      - name: smoke
        shell: pwsh
        # No NVIDIA driver (nvcuda.dll) on CI runners: only check the artefact exists and its size.
        run: |
          $exe = "build/kawpowminer/Release/kawpowminer.exe"
          if (-not (Test-Path $exe)) { throw "binary missing" }
          "size: $((Get-Item $exe).Length) bytes"
          if (Test-Path (Join-Path $env:SystemRoot "System32/nvcuda.dll")) { & $exe --version } else { "no NVIDIA driver on this runner; --version skipped" }
      - name: package
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'set\(PROJECT_VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          $d = "kraskus-kawpowminer-$v"; New-Item -ItemType Directory -Force dist/$d | Out-Null
          Copy-Item build/kawpowminer/Release/kawpowminer.exe dist/$d/
          Compress-Archive -Path dist/$d -DestinationPath dist/kraskus-kawpowminer-$v-windows-x64.zip
          (Get-FileHash dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower()) *$(Split-Path $_.Path -Leaf)" }) | Set-Content dist/SHA256SUMS-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*

  release:
    name: release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect and hash
        run: |
          mkdir -p release
          # The CUDA 12.4 build is the release Linux binary (sm_61..sm_90 + PTX; Blackwell JITs via
          # the NVRTC clamp); the CUDA 12.8 build is kept as a separate, clearly named artefact.
          V=${GITHUB_REF_NAME#v}
          cp artifacts/linux-x64-cuda12.4.1/kraskus-kawpowminer-$V-linux-x64-cuda12.4.1.tar.gz release/kraskus-kawpowminer-$V-linux-x64.tar.gz
          cp artifacts/linux-x64-cuda12.8.0/kraskus-kawpowminer-$V-linux-x64-cuda12.8.0.tar.gz release/kraskus-kawpowminer-$V-linux-x64-cuda12.8.tar.gz
          cp artifacts/windows-x64/kraskus-kawpowminer-$V-windows-x64.zip release/
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "kraskus-kawpowminer $GITHUB_REF_NAME" --notes "Kraskus fork of kawpowminer (GPL-3.0, no fee). Source: this tag. Hashes: SHA256SUMS. See docs/RELEASE.md and docs/qualification/." --verify-tag
